<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#170b35">
<title>ديوانية الألعاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { min-height: 100dvh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 14px 16px 20px; min-height: 100dvh; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 12px; gap: 8px; }
  .top .logo { font-size: 1.15rem; }
  .screen { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; text-align: center; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .big { font-size: 4rem; line-height: 1.1; }
  h2 { font-size: 1.6rem; font-weight: 900; }
  p.m { color: var(--muted); font-size: 1.05rem; }
  .field { width: 100%; padding: 16px; font-size: 1.3rem; border-radius: 16px; border: 2px solid var(--line); background: rgba(0,0,0,.25); color: var(--text); text-align: center; outline: none; }
  .field:focus { border-color: var(--gold); }
  .field.code { letter-spacing: 10px; font-weight: 900; text-transform: uppercase; direction: ltr; font-size: 1.8rem; }
  .q { font-size: 1.3rem; font-weight: 800; line-height: 1.6; padding: 16px; }
  .optbtn { width: 100%; text-align: center; background: var(--card2); color: var(--text); font-size: 1.25rem; font-weight: 800; padding: 15px; border-radius: 16px; border: 2px solid var(--line); transition: transform .1s; }
  .optbtn:active { transform: scale(.96); }
  .optbtn:disabled { opacity: .4; }
  .optbtn small { display: block; font-size: .8rem; color: var(--muted); }
  .bar { height: 8px; border-radius: 8px; background: var(--card); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); transition: width .25s linear; }
  .home-host { margin-top: 10px; color: var(--muted); font-size: .95rem; }
  .home-host a { color: var(--gold); }
  .score { font-size: 3rem; font-weight: 900; color: var(--gold); }
  .avatar-big { font-size: 6rem; animation: bob 2.4s ease-in-out infinite; display: inline-block; }

  /* صج ولا چذب */
  .tfbtns { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 55dvh; }
  .tfbtn { flex: 1; border-radius: 28px; font-size: 3rem; font-weight: 900; color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,.3); transition: transform .1s; }
  .tfbtn:active { transform: scale(.96); }
  .tfbtn.t { background: linear-gradient(160deg, #2ee59d, #0f9d68); box-shadow: 0 8px 0 #0a6b47; }
  .tfbtn.f { background: linear-gradient(160deg, #ff4d6d, #c21d3d); box-shadow: 0 8px 0 #85122a; }

  /* إيموجي */
  .ebtns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ebtn { background: var(--oc); color: #fff; border-radius: 22px; min-height: 120px; font-size: 1.3rem; font-weight: 900; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 6px 0 rgba(0,0,0,.3); text-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .1s; }
  .ebtn:active { transform: scale(.95); }
  .ebtn .shape { font-size: 1.6rem; opacity: .85; }

  /* منو فينا */
  .whobtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .whobtn { background: color-mix(in srgb, var(--c) 25%, transparent); border: 2px solid var(--c); color: var(--text); border-radius: 18px; padding: 12px 6px; font-weight: 800; font-size: 1.1rem; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform .1s; }
  .whobtn:active { transform: scale(.95); }
  .whobtn .a { font-size: 2.4rem; }
  .whobtn small { color: var(--muted); font-size: .75rem; }

  /* مافيا */
  body.night { background: radial-gradient(ellipse at 50% 120%, #1a1f4a 0, #05040f 70%); animation: none; }
  .rolecard { perspective: 1000px; height: 300px; cursor: pointer; }
  .rolecard .inner { position: relative; width: 100%; height: 100%; transition: transform .7s cubic-bezier(.3,1.4,.5,1); transform-style: preserve-3d; }
  .rolecard.open .inner { transform: rotateY(180deg); }
  .rolecard .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 18px; }
  .rolecard .front { background: repeating-linear-gradient(45deg, #2a1660, #2a1660 14px, #321a72 14px, #321a72 28px); border: 3px solid #b388ff; font-size: 1.3rem; font-weight: 800; }
  .rolecard .back { transform: rotateY(180deg); background: linear-gradient(160deg, color-mix(in srgb, var(--rc) 45%, #170b35), #170b35); border: 3px solid var(--rc); box-shadow: 0 0 50px color-mix(in srgb, var(--rc) 50%, transparent); }
  .killcard .front { background: radial-gradient(circle at 50% 30%, #5a0010, #1a0006 75%); border-color: #ff2d4d; box-shadow: 0 0 40px rgba(255,30,60,.45); overflow: hidden; }
  .killcard .back { background: radial-gradient(circle at 50% 20%, #7a0016, #14000a 80%); border-color: #ff2d4d; box-shadow: 0 0 60px rgba(255,30,60,.6); overflow: hidden; }
  .killcard small { color: #ffb3c0; font-weight: 600; }
  .kdrip { position: absolute; top: 0; left: 0; right: 0; height: 60px; background: radial-gradient(14px 30px at 10% 0, #b0001e 98%, transparent) , radial-gradient(10px 46px at 28% 0, #b0001e 98%, transparent), radial-gradient(16px 26px at 47% 0, #b0001e 98%, transparent), radial-gradient(9px 52px at 66% 0, #b0001e 98%, transparent), radial-gradient(13px 34px at 86% 0, #b0001e 98%, transparent); animation: drip 2.4s ease-in infinite alternate; }
  @keyframes drip { from { transform: scaleY(.6); transform-origin: top; } to { transform: scaleY(1.25); transform-origin: top; } }
  .knife { font-size: 4.2rem; line-height: 1; animation: stab 1.4s cubic-bezier(.5,0,.3,1.6) infinite; }
  @keyframes stab { 0%,100% { transform: rotate(-35deg) translate(0,0); } 40% { transform: rotate(-35deg) translate(-14px,14px); } 55% { transform: rotate(-35deg) translate(6px,-6px); } }
  .kt { font-size: 1.3rem; font-weight: 900; color: #ff8fa3; margin-top: 4px; }
  .killer { display: flex; align-items: center; gap: 10px; font-size: 1.7rem; font-weight: 900; padding: 6px 18px; border-radius: 999px; border: 3px solid var(--c); background: rgba(0,0,0,.35); animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  .killer span { font-size: 2rem; } .killer b { font-size: 1.4rem; }
  .hush { background: rgba(255,45,77,.12); border: 2px dashed #ff2d4d; border-radius: 18px; padding: 12px 14px; line-height: 1.7; font-size: 1rem; }
  .hush b { color: #ff6b81; font-size: 1.15rem; }
  .rolecard .ri { font-size: 5rem; line-height: 1; }
  .rolecard .rn { font-size: 2.4rem; font-weight: 900; color: var(--rc); }
  .rolecard .rd { color: var(--text); font-size: 1rem; opacity: .9; }
  .mtarget { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .checks { text-align: right; font-size: 1rem; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; }
  .result { font-size: 2.2rem; font-weight: 900; }
  .result.ok { color: var(--green); } .result.no { color: var(--pink); }
</style>
</head>
<body>
<div id="floaters"></div>
<div class="wrap layer">
  <div class="top"><div class="logo"><span class="bob">🎉</span> ديوانية <b>الألعاب</b></div><div id="me"></div></div>
  <div class="bar hidden" id="bar"><i id="bari"></i></div>
  <div class="screen" id="screen"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const blankify = q => esc(q).replace('____', '<span class="blank">؟</span>');
const SHAPES = ['▲', '◆', '●', '■'];
const store = {
  get() { try { return JSON.parse(localStorage.getItem('dgPlayer') || 'null'); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem('dgPlayer', JSON.stringify(v)) : localStorage.removeItem('dgPlayer'); } catch {} },
};
let S = null, sess = null, es = null, offset = 0, lastKey = '';

(() => {
  const em = ['🐪', '🌴', '💎', '🌙', '⭐', '☕', '🎉', '🦅', '🐟'];
  const f = $('#floaters');
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('span'); s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = 16 + Math.random() * 18 + 's'; s.style.animationDelay = -Math.random() * 30 + 's';
    f.appendChild(s);
  }
})();

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
function toast(m) { document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
const vibrate = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
const G = () => S && S.games.find(g => g.id === S.game);
const RMETA = {
  mafia: { n: 'مافيا', i: '😈', c: '#ff4d6d', d: 'بالليل اختار ضحية مع ربعك… وبالنهار مثّل إنك بريء 😇' },
  doctor: { n: 'دكتور', i: '🩺', c: '#2ee59d', d: 'كل ليلة اختار واحد تنقذه (حتى نفسك)' },
  cop: { n: 'شرطي', i: '🕵️', c: '#4cc9f0', d: 'كل ليلة حقق في واحد وبتعرف إذا هو مافيا' },
  citizen: { n: 'مواطن', i: '🙂', c: '#ffc23d', d: 'ما عندك قوة… بس عندك صوت! اكشف المافيا' },
};

function showJoin(err) {
  sess = null; S = null; lastKey = ''; if (es) es.close();
  $('#me').innerHTML = ''; $('#bar').classList.add('hidden');
  const params = new URLSearchParams(location.search);
  const saved = store.get() || {};
  $('#screen').innerHTML = `<div class="stack fade">
    <div class="big">🎉</div><h2>ألعاب للربع… كويتية ١٠٠٪ 🇰🇼</h2>
    <input class="field code" id="code" maxlength="4" placeholder="XXXX" autocomplete="off" value="${esc(params.get('c') || '')}">
    <input class="field" id="name" maxlength="14" placeholder="شسمك؟" autocomplete="off" value="${esc(saved.name || '')}">
    <button class="btn" id="joinBtn">دش 🚪</button>
    <div class="home-host">عندك تلفزيون أو لابتوب؟ <a href="/host">افتح الشاشة الكبيرة</a> وبدّ لعبة جديدة</div></div>`;
  $('#joinBtn').onclick = join;
  $('#name').onkeydown = e => { if (e.key === 'Enter') join(); };
  (params.get('c') ? $('#name') : $('#code')).focus();
  if (err) toast(err);
}

async function join() {
  const code = $('#code').value.trim().toUpperCase(), name = $('#name').value.trim();
  if (code.length !== 4) return toast('رمز الغرفة ٤ حروف');
  if (!name) return toast('اكتب اسمك');
  $('#joinBtn').disabled = true;
  const r = await api('/api/join', { code, name });
  $('#joinBtn').disabled = false;
  if (r.error) return toast(r.error);
  sess = { code: r.code, pid: r.pid, name };
  store.set(sess);
  history.replaceState(null, '', '/');
  connect();
}

function connect() {
  if (es) es.close();
  let fails = 0;
  es = new EventSource(`/api/events?code=${sess.code}&pid=${sess.pid}`);
  es.onmessage = e => { fails = 0; onState(JSON.parse(e.data)); };
  es.onerror = async () => {
    if (++fails < 3 && es.readyState !== 2) return;
    const r = await api('/api/join', { code: sess.code, pid: sess.pid }).catch(() => ({}));
    if (r.error) { store.set({ name: sess.name }); showJoin('اللعبة خلصت، دش غرفة جديدة'); }
    else if (es.readyState === 2) connect();
  };
}

function onState(s) {
  offset = s.now - Date.now();
  const prevPhase = S && S.phase; S = s;
  if (!s.me) { showJoin('طلعت من الغرفة'); return; }
  $('#me').innerHTML = `<span class="chip" style="--c:${s.me.color}"><span class="av">${s.me.avatar}</span>${esc(s.me.name)} · ${s.me.score}</span>`;
  const k = [s.phase, s.round, s.game, s.answered, s.voted].join('|');
  if (k !== lastKey) { lastKey = k; if (prevPhase && prevPhase !== s.phase) vibrate(70); render(); }
}

function send(type, extra) {
  return api('/api/action', { code: sess.code, pid: sess.pid, type, ...extra }).then(r => { if (r.error) { toast(r.error); vibrate([60, 40, 60]); } return r; });
}
const waitScreen = (icon, title, sub) => `<div class="fade"><div class="big">${icon}</div><h2>${title}</h2>${sub ? `<p class="m" style="margin-top:10px">${sub}</p>` : ''}</div>`;

function render() {
  const sc = $('#screen'), ph = S.phase, game = G();
  document.body.classList.toggle('night', S.game === 'mafia' && ['roles', 'night'].includes(ph));
  if (S.game === 'mafia' && S.mafia && !['lobby', 'intro'].includes(ph)) return renderMafia(sc, ph);
  if (ph === 'lobby') {
    sc.innerHTML = `<div class="fade"><div class="avatar-big">${S.me.avatar}</div><h2>هلا والله يا ${esc(S.me.name)}!</h2>
      <p class="m" style="margin-top:10px">اختاروا لعبة من الشاشة الكبيرة 📺</p></div>`;
  } else if (ph === 'intro') {
    sc.innerHTML = `<div><div class="big zoomin" style="font-size:6rem">${game.icon}</div><h2 class="pop" style="color:${game.color}">${esc(game.name)}</h2><p class="m" style="margin-top:10px">استعد… بتبدي! 🔥</p></div>`;
  }
  // ---- كذبة ----
  else if (ph === 'write') {
    if (S.answered) sc.innerHTML = `<div class="fade"><div class="big">😏</div><h2>كذبتك جاهزة</h2><div class="glass q" style="margin-top:12px;color:var(--gold)">${esc(S.myLie)}</div><p class="m" style="margin-top:12px">انطر الباجين يخلصون…</p></div>`;
    else {
      sc.innerHTML = `<div class="stack fade"><div class="glass q">${blankify(S.question)}</div>
        <p class="m">اكتب <b style="color:var(--gold)">كذبة</b> تمشي على الباجين ✍️</p>
        <input class="field" id="lie" maxlength="40" placeholder="كذبتك هني…" autocomplete="off">
        <button class="btn" id="sendLie">طرّش 🤥</button></div>`;
      const go = async () => { const t = $('#lie').value.trim(); if (!t) return toast('اكتب شي!'); $('#sendLie').disabled = true; await send('answer', { text: t }); const b = $('#sendLie'); if (b) b.disabled = false; };
      $('#sendLie').onclick = go; $('#lie').onkeydown = e => { if (e.key === 'Enter') go(); }; $('#lie').focus();
    }
  } else if (ph === 'vote') {
    if (S.voted) sc.innerHTML = waitScreen('🗳️', 'صوّتت!', 'طالع الشاشة الكبيرة 👀');
    else {
      sc.innerHTML = `<div class="stack fade"><p class="m">وين الجواب <b style="color:var(--green)">الصج</b>؟</p>
        ${S.options.map(o => `<button class="optbtn" data-id="${o.id}" ${o.id === S.myOption ? 'disabled' : ''}>${esc(o.text)}${o.id === S.myOption ? '<small>كذبتك 😏</small>' : ''}</button>`).join('')}</div>`;
      sc.querySelectorAll('.optbtn').forEach(b => b.onclick = () => { sc.querySelectorAll('.optbtn').forEach(x => x.disabled = true); send('vote', { optionId: b.dataset.id }).then(r => r.error && render()); });
    }
  }
  // ---- الألعاب السريعة ----
  else if (ph === 'answer') {
    if (S.answered) {
      let picked = S.myAnswer;
      if (S.game === 'who') { const p = S.players.find(x => x.id === picked); picked = p ? `${p.avatar} ${esc(p.name)}` : ''; }
      else if (S.game === 'tf') picked = picked ? 'صج ✅' : 'چذب ❌';
      else picked = esc(picked);
      sc.innerHTML = waitScreen('🤞', 'تم!', `اخترت: <b style="color:var(--gold)">${picked}</b><br>انطر الباجين…`);
    } else if (S.game === 'who') {
      sc.innerHTML = `<div class="stack fade"><div class="glass q">${esc(S.prompt)}</div>
        <div class="whobtns">${S.players.map(p => `<button class="whobtn" data-v="${p.id}" style="--c:${p.color}"><span class="a">${p.avatar}</span>${esc(p.name)}${p.id === S.me.id ? '<small>(أنت)</small>' : ''}</button>`).join('')}</div></div>`;
      sc.querySelectorAll('.whobtn').forEach(b => b.onclick = () => pick(b.dataset.v));
    } else if (S.game === 'tf') {
      sc.innerHTML = `<div class="stack fade" style="flex:1"><div class="glass q">${esc(S.statement)}</div>
        <div class="tfbtns"><button class="tfbtn t" data-v="1">صج ✅</button><button class="tfbtn f" data-v="0">چذب ❌</button></div></div>`;
      sc.querySelectorAll('.tfbtn').forEach(b => b.onclick = () => pick(b.dataset.v === '1'));
    } else if (S.game === 'emoji') {
      sc.innerHTML = `<div class="stack fade"><div style="font-size:3.4rem;letter-spacing:6px">${S.emoji}</div>
        <div class="ebtns">${S.options.map((o, i) => `<button class="ebtn o${i}" data-i="${i}"><span class="shape">${SHAPES[i]}</span>${esc(o)}</button>`).join('')}</div></div>`;
      sc.querySelectorAll('.ebtn').forEach(b => b.onclick = () => pick(S.options[+b.dataset.i]));
    }
  }
  else if (ph === 'reveal') {
    const g = (S.gains && S.gains[S.me.id]) || 0;
    if (S.game === 'tf' || S.game === 'emoji') {
      const ok = S.reveal.right.some(p => p.id === S.me.id);
      const answered = ok || S.reveal.wrong.some(p => p.id === S.me.id);
      sc.innerHTML = `<div class="${ok ? 'pop' : 'shake'}"><div class="big">${ok ? '🎉' : answered ? '😬' : '⏰'}</div>
        <div class="result ${ok ? 'ok' : 'no'}">${ok ? 'صح عليك!' : answered ? 'خطأ!' : 'ما لحقت!'}</div>
        ${ok ? `<div class="score">+${g}</div>` : `<p class="m" style="margin-top:8px">الجواب: <b style="color:var(--gold)">${S.game === 'tf' ? (S.reveal.truth ? 'صج' : 'چذب') : esc(S.reveal.answer)}</b></p>`}</div>`;
      vibrate(ok ? [50, 30, 50] : 250);
    } else if (S.game === 'who') {
      sc.innerHTML = waitScreen('👀', 'طالع الشاشة الكبيرة!', g ? `<b style="color:var(--green);font-size:1.4rem">+${g}</b> صوّتت مع الأغلبية 😎` : 'خلنا نشوف منو انفضح…');
    } else {
      sc.innerHTML = waitScreen('👀', 'طالع الشاشة الكبيرة!', 'الحين نكشف منو ضحك على منو…');
    }
  }
  else if (ph === 'scores' || ph === 'end') {
    const rows = S.players.slice().sort((a, b) => b.score - a.score);
    const rank = rows.findIndex(p => p.id === S.me.id) + 1;
    const g = (S.gains && S.gains[S.me.id]) || 0;
    const msg = ph === 'end' ? (rank === 1 ? '👑 أنت بطل الديوانية!' : `خلصت اللعبة، ترتيبك ${rank}`) : (g ? `+${g} هالجولة 🔥` : 'هالجولة ما طلعت بشي 😅');
    sc.innerHTML = `<div class="fade"><div class="big">${['🥇', '🥈', '🥉'][rank - 1] || '🎯'}</div><h2>${msg}</h2>
      <div class="score">${S.me.score}</div><p class="m">المركز ${rank} من ${rows.length}</p>
      ${ph === 'end' ? '<p class="m" style="margin-top:18px">نعيدها ولا لعبة ثانية؟ اختاروا من الشاشة الكبيرة 🎮</p>' : ''}</div>`;
    if (ph === 'end' && rank === 1) vibrate([100, 50, 100, 50, 300]);
  }
}

let killShown = false, killOpen = false;
function renderMafia(sc, ph) {
  const M = S.mafia, me = M.me;
  const pl = id => S.players.find(p => p.id === id) || { name: '؟', avatar: '❔', color: '#888' };
  if (!me) { sc.innerHTML = waitScreen('👀', 'تتفرّج هالجولة', 'دخلت بعد ما بدت اللعبة… بتلعب الجولة الجاية'); return; }
  const R = RMETA[me.role];
  const roleLine = `<div style="font-size:.95rem;color:var(--muted)">دورك: <b style="color:${R.c}">${R.i} ${R.n}</b></div>`;
  const checks = me.checks.length ? `<div class="glass checks"><b>🕵️ تحقيقاتك:</b>${me.checks.map(c => `<div>${c.avatar} ${esc(c.name)}: ${c.mafia ? '<b style="color:var(--pink)">مافيا 😈</b>' : '<b style="color:var(--green)">بريء ✅</b>'}</div>`).join('')}</div>` : '';
  const targets = (filter, label) => `<div class="mtarget">${M.alive.filter(filter).map(id => { const p = pl(id); return `<button class="whobtn" data-t="${id}" style="--c:${p.color}"><span class="a">${p.avatar}</span>${esc(p.name)}${id === S.me.id ? '<small>(أنت)</small>' : ''}</button>`; }).join('')}</div>${label || ''}`;
  const bind = type => sc.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { sc.querySelectorAll('button').forEach(x => x.disabled = true); vibrate(30); send(type, { target: b.dataset.t }).then(r => r.error && render()); });

  if (!me.alive && ph !== 'end') {
    if (!me.killedBy) { sc.innerHTML = `<div class="fade"><div class="big">💀</div><h2>انطردت!</h2><p class="m" style="margin-top:10px">تفرّج بس… ولا تفضح أحد 🤐</p>${roleLine}</div>`; return; }
    // انذبح بالليل: يشوف منو ذبحه… بالسر
    const first = !killShown; killShown = true;
    const killers = me.killedBy.map(k => `<div class="killer" style="--c:${k.color}"><span>${k.avatar}</span>${esc(k.name)}<b>😈</b></div>`).join('');
    sc.innerHTML = `<div class="stack fade"><div class="rolecard killcard ${killOpen ? 'open' : ''}" id="kc"><div class="inner">
        <div class="face front"><div class="kdrip"></div><div style="font-size:4rem">🩸</div>انذبحت البارحة…<br>اضغط عشان تعرف منو ذبحك<br><small>🤫 خبّ التلفون عن الباجين</small></div>
        <div class="face back"><div class="kdrip"></div><div class="knife">🔪</div><div class="kt">ذبحك${me.killedBy.length > 1 ? 'م' : ''}:</div>${killers}</div>
      </div></div>
      <div class="hush">🤐 <b>اسكت!</b> أنت ميت الحين<br>لا تتكلم، لا تأشر، ولا تسوي وجه… خلهم يكتشفونه بروحهم</div>${roleLine}</div>`;
    $('#kc').onclick = () => { killOpen = !killOpen; $('#kc').classList.toggle('open', killOpen); vibrate(killOpen ? [60, 40, 200] : 20); };
    if (first) vibrate([300, 100, 300]);
    return;
  }
  killShown = false; killOpen = false;
  if (ph === 'roles') {
    const team = me.team.length ? `<div class="rd">ربعك: ${me.team.map(t => `${t.avatar} ${esc(t.name)}`).join('، ')}</div>` : '';
    sc.innerHTML = `<div class="stack fade"><div class="rolecard" id="rc"><div class="inner">
        <div class="face front"><div style="font-size:4rem">🃏</div>اضغط عشان تشوف دورك<br><small style="color:var(--muted)">🤫 خبّ التلفون عن الباجين</small></div>
        <div class="face back" style="--rc:${R.c}"><div class="ri">${R.i}</div><div class="rn">${R.n}</div><div class="rd">${R.d}</div>${team}</div>
      </div></div>
      ${S.answered ? '<p class="m">✅ تمام… انطر الباجين</p>' : '<button class="btn" id="ready">شفت ✅</button>'}</div>`;
    $('#rc').onclick = () => { $('#rc').classList.toggle('open'); vibrate(20); };
    if ($('#ready')) $('#ready').onclick = () => { $('#ready').disabled = true; send('mready'); };
  } else if (ph === 'night') {
    if (S.answered) { sc.innerHTML = waitScreen('🌙', 'تم ✅', 'سكّر عيونك وانطر الصبح… 😴'); return; }
    if (me.role === 'mafia') {
      sc.innerHTML = `<div class="stack fade"><div class="big">🔪</div><h2 style="color:var(--pink)">اختار ضحيتك</h2>${me.team.length ? `<p class="m">اتفقوا بالسر مع: ${me.team.map(t => t.avatar + ' ' + esc(t.name)).join('، ')}</p>` : ''}
        ${targets(id => !me.team.some(t => t.id === id) && id !== S.me.id)}</div>`;
      bind('mnight');
    } else if (me.role === 'doctor') {
      sc.innerHTML = `<div class="stack fade"><div class="big">🩺</div><h2 style="color:var(--green)">منو تنقذ الليلة؟</h2>${targets(() => true)}</div>`;
      bind('mnight');
    } else if (me.role === 'cop') {
      sc.innerHTML = `<div class="stack fade"><div class="big">🕵️</div><h2 style="color:var(--blue)">منو تحقق فيه؟</h2>${targets(id => id !== S.me.id)}${checks}</div>`;
      bind('mnight');
    } else {
      sc.innerHTML = `<div class="stack fade"><div class="big">🤔</div><h2 style="color:var(--gold)">منو تشك فيه؟</h2><p class="m">اختار أحد عشان حركتك تصير مثل الباجين… محد يعرف إنك مواطن 😏</p>
        ${targets(id => id !== S.me.id)}</div>`;
      bind('mnight');
    }
  } else if (ph === 'dawn') {
    const last = me.checks[me.checks.length - 1];
    const copRes = me.role === 'cop' && last && last.day === M.day ? `<div class="glass q" style="margin-top:14px">🕵️ ${last.avatar} ${esc(last.name)} ${last.mafia ? '<b style="color:var(--pink)">مافيا 😈!</b>' : '<b style="color:var(--green)">بريء ✅</b>'}</div>` : '';
    sc.innerHTML = `<div class="fade"><div class="big">☀️</div><h2>طالع الشاشة الكبيرة!</h2>${copRes}</div>`;
    if (copRes) vibrate([40, 30, 40]);
  } else if (ph === 'discuss') {
    sc.innerHTML = `<div class="stack fade"><div class="big">🗣️</div><h2>تناقشوا!</h2><p class="m">منو تشكّون فيه؟ دافع عن نفسك 😅</p>${roleLine}${checks}</div>`;
  } else if (ph === 'mvote') {
    if (S.answered) { const v = me.myVote; sc.innerHTML = waitScreen('🗳️', 'صوّتت!', v === 'skip' ? 'اخترت تخطي ⏭' : `صوّتت على ${pl(v).avatar} ${esc(pl(v).name)}`); return; }
    sc.innerHTML = `<div class="stack fade"><h2>منو تطردون؟ 🚪</h2>${targets(id => id !== S.me.id, '<button class="optbtn" data-t="skip">⏭ تخطي (ما أطرد أحد)</button>')}</div>`;
    bind('mvote');
  } else if (ph === 'mresult') {
    sc.innerHTML = waitScreen('⚖️', 'طالع الشاشة الكبيرة!', 'منو انطرد؟ 😬');
  } else if (ph === 'end') {
    const won = (me.role === 'mafia') === (M.winner === 'mafia');
    sc.innerHTML = `<div class="${won ? 'pop' : 'shake'}"><div class="big">${won ? '🏆' : '😢'}</div><div class="result ${won ? 'ok' : 'no'}">${won ? 'فزت!' : 'خسرت!'}</div>
      <p class="m" style="margin-top:8px">${M.winner === 'mafia' ? 'المافيا فازت 😈' : 'الديوانية فازت 🎉'}</p>${roleLine}
      <p class="m" style="margin-top:18px">نعيدها ولا لعبة ثانية؟ اختاروا من الشاشة الكبيرة 🎮</p></div>`;
    vibrate(won ? [100, 50, 100, 50, 300] : 300);
  }
}

function pick(value) {
  $('#screen').querySelectorAll('button').forEach(b => b.disabled = true);
  vibrate(30);
  send('pick', { value }).then(r => { if (r.error) render(); });
}

setInterval(() => {
  const bar = $('#bar');
  if (!S || !S.deadline || !['write', 'vote', 'answer', 'roles', 'night', 'discuss', 'mvote'].includes(S.phase)) { bar.classList.add('hidden'); return; }
  const left = Math.max(0, (S.deadline - (Date.now() + offset)) / 1000);
  bar.classList.remove('hidden'); $('#bari').style.width = (left / (S.phaseSecs || 60) * 100) + '%';
}, 200);

(async () => {
  const saved = store.get();
  const urlCode = new URLSearchParams(location.search).get('c');
  if (saved && saved.pid && (!urlCode || urlCode.toUpperCase() === saved.code)) {
    const r = await api('/api/join', { code: saved.code, pid: saved.pid }).catch(() => ({ error: 1 }));
    if (!r.error) { sess = saved; connect(); return; }
    store.set({ name: saved.name });
  }
  showJoin();
})();
</script>
</body>
</html>
